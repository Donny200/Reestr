<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Davlat tashkilotlari va ularning funksiyalari bo‘yicha yagona elektron katalog"
    />
    <link rel="preload" href="/fonts/onest-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/onest-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/onest-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add('js');
        try {
          var stored = localStorage.getItem('reestr-theme');
          var dark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) root.classList.add('dark');
        } catch (error) {}
      })();
    </script>
    <title>Reestr Task — Davlat xizmatlari katalogi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
